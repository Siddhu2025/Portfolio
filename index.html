<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siddhaanth — Developer Portfolio</title>
<meta name="description" content="Portfolio of Siddhaanth: CS student building for the web, exploring AI and data.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--cobalt:#2a46ff;--coral:#ff5a4d;--lime:#b8f200;--sun:#ffd21f;--pink:#ff8fd0;--lav:#b9a3ff;--cream:#fff6e4;--ink:#14121f;--bg:var(--cream);--fg:var(--ink);--card:#fff;
--d:"Bowlby One","Arial Black",Impact,sans-serif;--b:"DM Sans",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,monospace;--sh:5px 5px 0 var(--ink);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--fg:#fff6e4;--card:#241f3d;--sh:5px 5px 0 var(--sun)}}
:root[data-theme="dark"]{--bg:#17142a;--fg:#fff6e4;--card:#241f3d;--sh:5px 5px 0 var(--sun)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.05rem/1.6 var(--b);overflow-x:hidden;background-image:radial-gradient(rgba(127,127,127,.18) 1px,transparent 1px);background-size:18px 18px}
a{color:inherit}h1,h2,h3{font-family:var(--d);font-weight:400;line-height:.95;margin:0;text-wrap:balance}
:focus-visible{outline:4px solid var(--cobalt);outline-offset:3px;box-shadow:0 0 0 7px var(--sun)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--m);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;z-index:99;background:var(--sun);color:var(--ink);padding:8px}
/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid var(--fg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;max-width:1180px;margin:0 auto}
.logo{font-family:var(--d);font-size:1.3rem;text-decoration:none;background:var(--lime);color:var(--ink);padding:2px 10px;border:3px solid var(--ink);border-radius:8px;transform:rotate(-3deg)}
nav ul{display:flex;gap:8px;list-style:none;margin:0;padding:0}
nav a{display:block;font:700 .9rem var(--m);text-decoration:none;padding:6px 14px;border:3px solid transparent;border-radius:99px;transition:transform .15s}
nav a:hover{transform:rotate(-4deg) scale(1.06);border-color:var(--fg)}
nav a[aria-current=page]{background:var(--coral);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tools{display:flex;gap:8px}.ib{font:700 1rem var(--m);background:var(--card);color:var(--fg);border:3px solid var(--fg);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer}
#menu{display:none}
@media(max-width:760px){#menu{display:block}nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:3px solid var(--fg);display:none}nav.open{display:block}nav ul{flex-direction:column;padding:12px 20px}nav a{padding:12px 16px}}
/* buttons / stickers */
.btn{display:inline-block;font:700 1rem var(--b);text-decoration:none;cursor:pointer;background:var(--cobalt);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 22px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;min-height:48px}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg)}.btn:active{transform:translate(4px,4px);box-shadow:0 0 0}
.btn.alt{background:var(--sun);color:var(--ink)}.btn.dis{opacity:.55;pointer-events:none}
.st{display:inline-block;font:700 .8rem var(--m);background:var(--pink);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:3px 9px;transform:rotate(var(--r,-3deg))}
.card{background:var(--card);border:3px solid var(--fg);border-radius:18px;box-shadow:var(--sh)}
section{padding:56px 0}
.page{display:none}.page.on{display:block;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding:40px 0 30px}
.hero h1{font-size:clamp(3rem,11vw,8.2rem);color:var(--cobalt);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);overflow-wrap:anywhere}
:root[data-theme="dark"] .hero h1{color:var(--sun)}
.hl{display:inline;background:linear-gradient(transparent 62%,var(--lime) 62%);color:var(--ink);padding:0 4px}
.stat{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:3px solid var(--fg);border-radius:99px;padding:4px 14px}
.dot{width:12px;height:12px;border-radius:50%;background:#18c24a;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.term{background:var(--ink);color:var(--lime);font:.85rem/1.6 var(--m);border-radius:12px;padding:14px;border:3px solid var(--fg);min-height:7.2em;margin:18px 0}
.term b{color:var(--sun)}
.stage{position:relative;aspect-ratio:1;max-width:460px;margin-inline:auto;width:100%}
.frame{position:absolute;inset:8% 8% 12% 12%;background:var(--lav);border:4px solid var(--ink);border-radius:46% 54% 42% 58%/55% 40% 60% 45%;box-shadow:10px 10px 0 var(--coral);overflow:hidden;display:grid;place-items:center}
.frame img{object-position:center 28%;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:0;top:0;width:34%;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.drag{position:absolute;left:0;bottom:6%;cursor:grab;touch-action:none;user-select:none;font-size:1.1rem;transform:rotate(-8deg);z-index:2}
.mascot{position:absolute;right:2%;bottom:0;width:30%;transition:transform .15s ease-out}
@media(max-width:820px){.hero{grid-template-columns:1fr}.stage{max-width:340px}}
.arrow{width:70px;animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(10px)}}
.cur{position:fixed;left:0;top:0;width:26px;height:26px;border:3px solid var(--coral);border-radius:50%;pointer-events:none;z-index:50;mix-blend-mode:multiply;display:none}
@media(pointer:fine){.cur{display:block}}
/* ticker */
.tick{background:var(--ink);color:var(--lime);border-block:3px solid var(--fg);overflow:hidden;white-space:nowrap;transform:rotate(-1.2deg);margin:20px -10px}
.tick div{display:inline-block;padding:12px 0;font:1.4rem var(--d);animation:tk 28s linear infinite}@keyframes tk{to{transform:translateX(-50%)}}
/* projects */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:22px}
.pc{grid-column:span 6;padding:18px;color:var(--ink);transition:transform .2s;position:relative;cursor:pointer;text-align:left;font:inherit;width:100%;display:block}
.pc:hover{transform:rotate(-1deg) translateY(-4px)}.pc:nth-child(1),.pc:nth-child(4){grid-column:span 12;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.pc h3{font-size:1.9rem;margin:10px 0}.pc .num{position:absolute;top:-16px;left:14px;font:2.6rem var(--d);-webkit-text-stroke:2px var(--ink);color:var(--card)}
.win{border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}.win i{display:block;background:var(--ink);padding:5px 8px;font-style:normal;color:var(--sun);font:.7rem var(--m);letter-spacing:.2em}
.win img{object-position:top;display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;transition:transform .4s}.pc:hover .win img{transform:scale(1.06)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tg span{font:.72rem var(--m);background:var(--ink);color:var(--cream);padding:2px 8px;border-radius:6px;transition:.15s}.tg span:hover{background:var(--cobalt);transform:translateY(-2px)}
@media(max-width:760px){.pc,.pc:nth-child(1),.pc:nth-child(4){grid-column:span 12;display:block}}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.fl button[aria-pressed=true]{background:var(--coral);color:var(--ink)}
dialog{max-width:640px;width:calc(100% - 32px);padding:24px;border:4px solid var(--ink);border-radius:18px;background:var(--card);color:var(--fg);box-shadow:10px 10px 0 var(--ink)}dialog::backdrop{background:rgba(20,18,31,.7)}
/* skills */
.sk{display:flex;flex-wrap:wrap;gap:12px}.sk button,.sk span.t{font:700 1rem var(--b);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;cursor:pointer;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .15s;position:relative}
.sk button:hover,.sk button:focus-visible{transform:rotate(var(--r,3deg)) scale(1.08)}
.sk .tip{display:block;font:400 .78rem var(--m);margin-top:2px;max-width:190px;text-align:left}
.panel{padding:24px;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.tl{border-left:4px dashed var(--fg);margin-left:10px;padding-left:22px}.tl>div{position:relative;margin-bottom:22px}.tl>div::before{content:"";position:absolute;left:-33px;top:6px;width:18px;height:18px;background:var(--coral);border:3px solid var(--ink);border-radius:50%}
.big{font:clamp(2.2rem,8vw,5.5rem)/.95 var(--d)}
.ph{background:var(--sun);border:3px dashed var(--ink);padding:3px 8px;border-radius:6px;color:var(--ink)}
/* form */
label{display:block;font:700 .85rem var(--m);margin:12px 0 4px}input,textarea{width:100%;font:inherit;padding:12px;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.err{color:#c4001a;font:700 .8rem var(--m);min-height:1.2em}:root[data-theme="dark"] .err{color:#ff9a9a}
footer{background:var(--ink);color:var(--cream);border-top:4px solid var(--lime);padding:36px 0;margin-top:40px}footer a{color:var(--lime)}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--ink);display:none;z-index:15}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cur{display:none!important}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph=(l,c="#ffd21f")=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="${c}"/><path d="M0 330l160-120 120 90 140-150 220 180v70H0z" fill="#14121f" opacity=".15"/><circle cx="500" cy="100" r="40" fill="#fff" opacity=".6"/><text x="320" y="210" text-anchor="middle" font-family="monospace" font-size="26" fill="#14121f">PLACEHOLDER · ${l}</text></svg>`);
const hex={"var(--lime)":"#b8f200","var(--sun)":"#ffd21f","var(--pink)":"#ff8fd0","var(--lav)":"#b9a3ff","var(--coral)":"#ff5a4d"};
const link=(u,t)=>u?`<a class="btn alt" href="${E(u)}" target="_blank" rel="noopener">${t}</a>`:`<span class="btn alt dis" title="Add this link in DATA">${t} (not set)</span>`;
const star=`<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2l11 30 32-4-22 24 17 27-31-8-7 31-14-29-30 3 20-25-14-27 28 11z" fill="#ffd21f" stroke="#14121f" stroke-width="4" stroke-linejoin="round"/></svg>`;
const pcard=(p,i)=>`<button class="card pc" style="background:${p.c}" data-i="${i}" aria-label="Open details for ${E(p.t)}"><span class="num" aria-hidden="true">${String(i+1).padStart(2,"0")}</span>
<div class="win"><i>● ● ●</i><img loading="lazy" width="640" height="400" src="${p.img||ph(p.t,hex[p.c])}" alt="${p.img?"Screenshot of ":"Screenshot placeholder for "}${E(p.t)}"></div>
<div><span class="st">${E(p.cat)}</span><h3>${E(p.t)}</h3><p>${E(p.desc)}</p><div class="tg">${p.tech.map(t=>`<span>${E(t)}</span>`).join("")}</div></div></button>`;
const skills=()=>`<div class="sk">${DATA.skills.map((s,i)=>`<button style="background:${s.c};--r:${(i%2?-4:4)}deg" aria-describedby="sd${i}">${E(s.n)}<span class="tip" id="sd${i}">${E(s.d)}</span></button>`).join("")}</div>`;
const social=()=>[["GitHub",DATA.github],["LinkedIn",DATA.linkedin]].map(([n,u])=>u?`<a class="btn" href="${E(u)}" target="_blank" rel="noopener">${n}</a>`:`<span class="btn dis">${n} (not set)</span>`).join(" ");

<section class="wrap"><div class="card panel" style="background:var(--cobalt);color:#fff;text-align:center"><p class="big">Got an idea? <span style="color:var(--lime)">Say hi.</span></p><a class="btn alt" href="#contact">Start a conversation</a></div></section>`,
about:()=>`<div class="wrap"><section><span class="st">the notebook</span><h1 class="big" tabindex="-1" style="margin-top:12px">About <span class="hl">me</span></h1></section>
<div class="cols"><div class="card panel" style="background:var(--pink)"><h2 style="font-size:1.6rem">Intro</h2>${DATA.bio.map(b=>`<p>${E(b)}</p>`).join("")}<p>${DATA.resume?`<a class="btn" href="${E(DATA.resume)}" download>Download résumé</a>`:`<span class="btn dis">Résumé (not set)</span>`}</p></div>
<div class="card panel" style="background:var(--lav)"><div class="win"><img loading="lazy" width="640" height="640" style="aspect-ratio:1;object-position:center 30%" src="${DATA.photo||ph("YOUR PHOTO","#b8f200")}" alt="${DATA.photo?"Portrait of "+E(DATA.name):"Profile photo placeholder"}"></div></div></div>
<section><h2 class="big" style="font-size:3rem">Education</h2><div class="tl" style="margin-top:24px">${DATA.education.map(e=>`<div><span class="st">${E(e.when)}</span><h3 style="font-size:1.4rem;margin:6px 0">${E(e.what)}</h3><p>${E(e.where)}</p></div>`).join("")}</div></section>
<section><h2 class="big" style="font-size:3rem">Skill board</h2><p class="mono">Hover or focus a tile. No made-up ratings.</p>${skills()}</section>
<div class="cols"><div class="card panel" style="background:var(--lime)"><h2 style="font-size:1.6rem">Currently exploring</h2><ul>${DATA.exploring.map(x=>`<li>${E(x)}</li>`).join("")}</ul></div><div class="card panel" style="background:var(--sun)"><h2 style="font-size:1.6rem">Looking for</h2><p><span class="ph">${E(DATA.seeking)}</span></p></div></div></div>`,
projects:()=>`<div class="wrap"><section><span class="st">the lab</span><h1 class="big" tabindex="-1" style="margin-top:12px">Show<span class="hl">case</span></h1><p class="mono"><span class="ph">Demo entries — links and details are placeholders</span></p>
<div class="fl" role="group" aria-label="Filter projects">${["all",...new Set(DATA.projects.map(p=>p.cat))].map((c,i)=>`<button class="btn alt" data-f="${c}" aria-pressed="${i==0}">${c}</button>`).join("")}</div>
<div class="grid" id="pg" style="margin-top:34px"></div><p id="empty" hidden>Nothing here yet — try another filter.</p></section></div>
<dialog id="dlg" aria-labelledby="dt"></dialog>`,
contact:()=>`<div class="wrap"><section><span class="st">final scene</span><h1 class="big" tabindex="-1" style="margin-top:12px">Let’s <span style="color:var(--coral)">talk</span>!</h1>
<div class="cols" style="margin-top:30px"><div class="card panel" style="background:var(--sun)"><h2 style="font-size:1.6rem">Direct lines</h2><p><a class="btn" href="mailto:${E(DATA.email)}">${E(DATA.email)}</a></p><p style="display:flex;gap:10px;flex-wrap:wrap">${social()}${DATA.resume?`<a class="btn alt" href="${E(DATA.resume)}">Résumé</a>`:""}</p><p class="mono">${E(DATA.status)}</p></div>
<form class="card panel" style="background:var(--lav)" id="cf" novalidate><h2 style="font-size:1.6rem">Write a note</h2><p class="mono">There’s no server here: sending opens your email app with the message pre-filled.</p>
<label for="n">Name</label><input id="n" autocomplete="name" aria-describedby="e1"><div class="err" id="e1"></div>
<label for="m">Email</label><input id="m" type="email" autocomplete="email" aria-describedby="e2"><div class="err" id="e2"></div>
<label for="s">Subject</label><input id="s"><label for="g">Message</label><textarea id="g" rows="5" aria-describedby="e3"></textarea><div class="err" id="e3"></div>
<button class="btn" type="submit">Open in email app</button><p role="status" id="fs" class="mono"></p></form></div></section></div>`
};
const main=$("#main"),names={home:"Home",about:"About",projects:"Projects",contact:"Contact"};
$("#links").innerHTML=Object.keys(names).map(k=>`<li><a href="#${k}" data-k="${k}">${names[k]}</a></li>`).join("");
$("#foot").textContent=`© ${new Date().getFullYear()} ${DATA.name} · placeholders marked TODO`;
function route(){let k=location.hash.slice(1);const nf=!pages[k]&&k!=="";if(!pages[k])k="home";
 main.innerHTML=pages[k]();document.title=`${names[k]} — ${DATA.name}`;
 document.querySelectorAll("#links a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.k===k)||(a.removeAttribute("aria-current")));
 document.querySelectorAll("#links a").forEach(a=>{if(a.dataset.k===k)a.setAttribute("aria-current","page")});
 if(nf)main.insertAdjacentHTML("afterbegin",`<div class="wrap"><p class="card panel" style="background:var(--coral)" role="alert"><b>404 · that page wandered off.</b> Here’s home instead.</p></div>`);
 main.firstElementChild.classList.add("page","on");window.scrollTo(0,0);$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
 (main.querySelector("h1")||main).focus({preventScroll:true});init[k]&&init[k]();}
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches,fine=matchMedia("(pointer:fine)").matches;
const init={
home(){const T=$("#term"),L=[`$ whoami`,`> ${DATA.name}, CS student`,`$ now --building`,`> AI/ML · data · web`];if(rm){T.innerHTML=L.map(l=>`<div>${E(l)}</div>`).join("");}else{let li=0,ci=0;T.innerHTML="";const tick=()=>{if(!T.isConnected||li>=L.length)return;let d=T.children[li]||T.appendChild(document.createElement("div"));d.textContent=L[li].slice(0,++ci);if(ci>=L[li].length){li++;ci=0;setTimeout(tick,300)}else setTimeout(tick,35)};tick();}
 const dr=$("#drag");let sx,sy,ox=0,oy=0,on=false;dr.onpointerdown=e=>{on=true;sx=e.clientX-ox;sy=e.clientY-oy;dr.setPointerCapture(e.pointerId);dr.style.cursor="grabbing"};dr.onpointermove=e=>{if(on){ox=e.clientX-sx;oy=e.clientY-sy;dr.style.translate=`${ox}px ${oy}px`}};dr.onpointerup=()=>{on=false;dr.style.cursor="grab"};
 dr.onkeydown=e=>{const m={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(m){e.preventDefault();ox+=m[0];oy+=m[1];dr.style.translate=`${ox}px ${oy}px`}};
 const cols=["#b9a3ff","#b8f200","#ffd21f","#ff8fd0"];let ci=0;$("#shape").onpointerenter=e=>{e.currentTarget.style.background=cols[++ci%4]};
 if(fine&&!rm){const st=$("#stage"),m=$("#mas");document.onpointermove=e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;m.style.transform=`translate(${x*14}px,${y*14}px) rotate(${x*10}deg)`;document.querySelectorAll(".pu").forEach(p=>p.style.transform=`translate(${Math.max(-1,Math.min(1,x*3))*2}px,${Math.max(-1,Math.min(1,y*3))*2}px)`)};
  document.querySelectorAll(".mag").forEach(b=>{b.onpointermove=e=>{const r=b.getBoundingClientRect();b.style.translate=`${(e.clientX-r.left-r.width/2)*.15}px ${(e.clientY-r.top-r.height/2)*.25}px`};b.onpointerleave=()=>b.style.translate=""})}
 bindCards();},
about(){},contact(){const f=$("#cf");f.onsubmit=e=>{e.preventDefault();const v=id=>$("#"+id).value.trim(),er={e1:v("n")?"":"Please enter your name.",e2:/^\S+@\S+\.\S+$/.test(v("m"))?"":"Please enter a valid email.",e3:v("g")?"":"Please write a message."};let bad=0;for(const k in er){$("#"+k).textContent=er[k];if(er[k])bad++}
 if(bad){$("#fs").textContent="Please fix the highlighted fields.";return}
 location.href=`mailto:${DATA.email}?subject=${encodeURIComponent(v("s")||"Hello from your portfolio")}&body=${encodeURIComponent(v("g")+"\n\n— "+v("n")+" ("+v("m")+")")}`;$("#fs").textContent="Your email app should open now. If not, write to "+DATA.email+" directly."}},
projects(){const g=$("#pg");const draw=f=>{const l=DATA.projects.map((p,i)=>[p,i]).filter(([p])=>f==="all"||p.cat===f);g.innerHTML=l.map(([p,i])=>pcard(p,i)).join("");$("#empty").hidden=l.length>0;bindCards()};draw("all");
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw(b.dataset.f)})}};
function bindCards(){document.querySelectorAll(".pc").forEach(c=>c.onclick=()=>{let d=$("#dlg");if(!d){d=document.createElement("dialog");d.id="dlg";d.setAttribute("aria-labelledby","dt");document.body.appendChild(d)}
 const p=DATA.projects[c.dataset.i];d.innerHTML=`<h2 id="dt" style="font-size:2rem">${E(p.t)}</h2><p>${E(p.desc)}</p><p><b>Purpose:</b> ${E(p.why)}</p><p>${E(p.long)}</p><div class="tg">${p.tech.map(t=>`<span>${E(t)}</span>`).join("")}</div><p style="display:flex;gap:10px;flex-wrap:wrap">${link(p.gh,"Source code")}${link(p.live,"Live demo")}<button class="btn" id="x">Close</button></p>`;d.showModal();$("#x").onclick=()=>d.close()})}
document.addEventListener("click",e=>{const d=$("#dlg");if(d&&e.target===d)d.close()});
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#theme").onclick=()=>{const r=document.documentElement;const isDark=matchMedia("(prefers-color-scheme:dark)").matches?r.dataset.theme!=="light":r.dataset.theme==="dark";r.dataset.theme=isDark?"light":"dark"};
const toTop=$("#top");toTop.onclick=()=>scrollTo({top:0,behavior:rm?"auto":"smooth"});addEventListener("scroll",()=>toTop.style.display=scrollY>600?"block":"none",{passive:true});
if(fine&&!rm){const c=$("#cur");addEventListener("pointermove",e=>c.style.transform=`translate(${e.clientX-13}px,${e.clientY-13}px)`,{passive:true})}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
